services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: affiliate
      POSTGRES_PASSWORD: affiliate
      POSTGRES_DB: affiliate
    ports:
      - "5432:5432"
    volumes:
      - affiliate_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affiliate -d affiliate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  affiliate_pg:
